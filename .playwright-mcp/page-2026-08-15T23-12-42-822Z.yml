  - main [ref=f2e39]:
    - generic [ref=f2e40]:
      - heading "Hello, World!" [level=1] [ref=f2e41]
      - paragraph [ref=f2e43]: Welcome to my blog, my name is Chris Weber (aka chrisweb)
      - paragraph [ref=f2e44]: I like
      - generic [ref=f2e45]:
        - paragraph [ref=f2e50]:
          - link "Web Development:" [ref=f2e51]:
            - /url: /web_development
          - text: In this portal you will find my articles about all things web development, so mostly about Javascript (Typescript), React, Next.js, APIs, CI/CD deployment, capacitor (web apps), WebGL, but probably also some posts about Cloud (serverless, edge, CDNs, ...), AI, IoT and maybe some more
        - paragraph [ref=f2e56]:
          - link "Games:" [ref=f2e57]:
            - /url: /games
          - text: I have always liked playing video games, be it on consoles, PC and yes even mobile (I know shame on me 😉). Playing games is my oldest hobby I still enjoy these days. I like playing games and also like watching people play on Twitch and sometimes I even do both at the same time.
        - paragraph [ref=f2e62]:
          - link "Lego:" [ref=f2e63]:
            - /url: /lego
          - text: If there is one hobby that helps me chill after a busy day it for sure is building things using bricks. I like building a lot as I can do it in the evening while also bing watching my favorite TV series or just listening to music. I like being creative and like watching Videos or Streams from other AFOLs.
        - paragraph [ref=f2e68]:
          - link "Music:" [ref=f2e69]:
            - /url: /music
          - text: There are a lot of different activities during which I like listening to music, hence the music genres I listen to vary depending on what I do. I have my road trip playlists for when I'm in my car, my work playlist I listen to while coding, my chill playlists when building with bricks, ...
        - paragraph [ref=f2e74]:
          - link "Memes:" [ref=f2e75]:
            - /url: /memes
          - text: A growing collection of memes that make me laugh. The most important ingredient for a good meme is humor, without it a meme is just a quote on a picture. A good meme can be used as a source of light relief during a tense situation.
        - paragraph [ref=f2e80]:
          - link "About me:" [ref=f2e81]:
            - /url: /about_me
          - text: Everything on this blog is already about me, but I also wanted to have a more personal area where I can write about things that are not related to web development, playing games and building with bricks.
